# EasyDC with Docker Compose:  docker compose up -d
# Then open https://<host>:3000/ to create the admin account. The browser warns
# once about the self-signed certificate; Settings takes your own.
#
# Upgrade:  docker compose pull && docker compose up -d
# The compose.yaml attached to each GitHub release names that version instead
# of latest; to upgrade it, change the tag, then run the same two commands.
services:
  easydc:
    image: easysysio/easydc:latest
    container_name: easydc
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # easydc.db: accounts, servers (with their bind passwords) and the audit log.
      - easydc-data:/data
      # To check the DCs' LDAPS certificates against your domain's CA instead of
      # turning on "Skip TLS verify", mount the CA certificate here and
      # uncomment SSL_CERT_FILE below.
      # - ./domain-ca.pem:/certs/domain-ca.pem:ro
    # environment:
    #   SSL_CERT_FILE: /certs/domain-ca.pem
    #   EASYDC_TLS: "off"    # only behind a reverse proxy that handles HTTPS
    # If the DCs' names are only in the domain's DNS:
    # dns:
    #   - 192.0.2.10

volumes:
  easydc-data:
