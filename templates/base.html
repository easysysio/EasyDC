<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EasyDC{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d6efd'/><rect x='6' y='8' width='20' height='7' rx='2' fill='%23fff'/><rect x='6' y='17' width='20' height='7' rx='2' fill='%23fff'/><circle cx='10' cy='11.5' r='1.3' fill='%230d6efd'/><circle cx='10' cy='20.5' r='1.3' fill='%230d6efd'/></svg>">
    <link rel="stylesheet" href="/static/vendor/bootstrap-5.3.0/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons-1.11.0/bootstrap-icons.min.css">
    <style>
        .hover-card:hover { border-color: #0d6efd !important; box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15) !important; }
        .card { transition: all 0.2s ease; }
    </style>
    <script>
    // Long lists, a page at a time. A <tbody data-paged="name"> gets a pager
    // under its table; its rows are searched by their data-search text (or
    // their text), from the box named by data-search-input. Pages add their
    // own filters with EasyTable.ready(), and the search and page survive a
    // form submitted from the page, so an action brings you back to the same
    // place.
    window.EasyTable = (function () {
        'use strict';
        const SIZES = [25, 50, 100, 250];
        const tables = {};
        const waiting = [];
        let saved = {};

        function pageSize() {
            try {
                const n = parseInt(localStorage.getItem('easydc.pageSize'), 10);
                if (SIZES.includes(n)) return n;
            } catch (e) { /* storage blocked: use the default */ }
            return 50;
        }

        function number(n) { return n.toLocaleString(); }

        function Table(body) {
            const t = this;
            t.key = body.dataset.paged;
            t.body = body;
            t.none = body.querySelector(':scope > tr.js-no-match');
            t.rows = Array.from(body.rows).filter(r => r !== t.none);
            t.text = new Map(t.rows.map(r => [r, (r.dataset.search || r.textContent).toLowerCase()]));
            t.filters = {};
            t.listeners = [];
            t.matching = t.rows;
            t.shown = t.rows;
            t.page = 1;
            t.size = pageSize();
            t.search = document.getElementById(body.dataset.searchInput || '');

            const card = body.closest('.card');
            const after = body.closest('.table-responsive') || body.closest('table');
            const bar = document.createElement('div');
            bar.className = (card ? 'card-footer bg-body ' : 'mt-2 ') +
                'd-flex flex-wrap align-items-center gap-2 small';
            bar.innerHTML = '<span class="text-muted js-range"></span>' +
                '<nav class="ms-auto" aria-label="Pages"><ul class="pagination pagination-sm mb-0"></ul></nav>' +
                '<select class="form-select form-select-sm w-auto" aria-label="Rows per page">' +
                SIZES.map(n => '<option value="' + n + '">' + n + ' per page</option>').join('') +
                '</select>';
            after.after(bar);
            t.bar = bar;
            t.top = card || after;
            t.range = bar.querySelector('.js-range');
            t.links = bar.querySelector('.pagination');
            t.select = bar.querySelector('select');
            t.select.value = String(t.size);
            t.select.addEventListener('change', function () {
                const first = (t.page - 1) * t.size;
                t.size = parseInt(t.select.value, 10);
                t.page = Math.floor(first / t.size) + 1;
                try { localStorage.setItem('easydc.pageSize', String(t.size)); } catch (e) { /* ignore */ }
                t.render();
            });
            t.links.addEventListener('click', function (e) {
                const link = e.target.closest('[data-page]');
                if (!link) return;
                e.preventDefault();
                t.page = parseInt(link.dataset.page, 10);
                t.render();
                if (t.top.getBoundingClientRect().top < 0) t.top.scrollIntoView();
            });

            if (t.search) {
                t.search.addEventListener('input', () => t.searchFor(t.search.value));
            }
            const back = saved[t.key];
            if (back) {
                if (t.search && back.q) t.search.value = back.q;
                t.page = back.page || 1;
                t.searchFor(t.search ? t.search.value : '', true);
            } else {
                t.render();
            }
        }

        // Every word must appear somewhere in the row.
        Table.prototype.searchFor = function (value, keepPage) {
            const words = value.toLowerCase().split(/\s+/).filter(Boolean);
            this.setFilter('search', words.length
                ? row => { const text = this.text.get(row); return words.every(w => text.includes(w)); }
                : null, keepPage);
        };

        // A filter is a test on a row; null removes it. Changing one goes back to page 1.
        Table.prototype.setFilter = function (name, test, keepPage) {
            if (test) this.filters[name] = test; else delete this.filters[name];
            const tests = Object.values(this.filters);
            this.matching = this.rows.filter(r => tests.every(f => f(r)));
            if (!keepPage) this.page = 1;
            this.render();
        };

        Table.prototype.on = function (listener) { this.listeners.push(listener); };

        Table.prototype.render = function () {
            const total = this.matching.length;
            const pages = Math.max(1, Math.ceil(total / this.size));
            this.page = Math.min(Math.max(1, this.page), pages);
            const start = (this.page - 1) * this.size;
            this.shown = this.matching.slice(start, start + this.size);
            const keep = this.shown.slice();
            if (this.none) {
                this.none.classList.toggle('d-none', total > 0 || this.rows.length === 0);
                keep.push(this.none);
            }
            this.body.replaceChildren(...keep);

            // Short lists need no pager.
            this.bar.classList.toggle('d-none', this.rows.length <= SIZES[0]);
            this.range.textContent = total === 0 ? 'Nothing to show'
                : number(start + 1) + '–' + number(start + this.shown.length) + ' of ' + number(total) +
                  (total < this.rows.length ? ' (filtered from ' + number(this.rows.length) + ')' : '');
            this.links.innerHTML = '';
            if (pages > 1) {
                const p = this.page;
                const want = [1, pages, p - 2, p - 1, p, p + 1, p + 2].filter(n => n >= 1 && n <= pages);
                const list = Array.from(new Set(want)).sort((a, b) => a - b);
                const item = (label, page, opts) => {
                    const li = document.createElement('li');
                    li.className = 'page-item' + (opts.active ? ' active' : '') + (opts.off ? ' disabled' : '');
                    const a = document.createElement(opts.off || opts.active ? 'span' : 'a');
                    a.className = 'page-link';
                    a.textContent = label;
                    if (opts.label) a.setAttribute('aria-label', opts.label);
                    if (opts.active) a.setAttribute('aria-current', 'page');
                    if (!opts.off && !opts.active) { a.href = '#'; a.dataset.page = page; }
                    li.appendChild(a);
                    this.links.appendChild(li);
                };
                item('‹', p - 1, { off: p === 1, label: 'Previous page' });
                list.forEach((n, i) => {
                    if (i > 0 && n - list[i - 1] > 1) item('…', 0, { off: true });
                    item(number(n), n, { active: n === p, label: 'Page ' + n });
                });
                item('›', p + 1, { off: p === pages, label: 'Next page' });
            }
            this.listeners.forEach(f => f(this));
        };

        document.addEventListener('DOMContentLoaded', function () {
            try {
                const back = JSON.parse(sessionStorage.getItem('easydc.lists') || 'null');
                sessionStorage.removeItem('easydc.lists');
                if (back && Date.now() - back.at < 60000) saved = back.tables || {};
            } catch (e) { /* storage blocked: start on page 1 */ }
            document.querySelectorAll('tbody[data-paged]').forEach(function (body) {
                tables[body.dataset.paged] = new Table(body);
            });
            waiting.splice(0).forEach(f => f());
        });

        // Remember where each list was, for the next page load: when a form
        // leaves the page, or when a script is about to reload it.
        function remember() {
            const state = {};
            Object.values(tables).forEach(function (t) {
                state[t.key] = { page: t.page, q: t.search ? t.search.value : '' };
            });
            try {
                sessionStorage.setItem('easydc.lists', JSON.stringify({ at: Date.now(), tables: state }));
            } catch (err) { /* ignore */ }
        }
        document.addEventListener('submit', function (e) {
            if (!e.defaultPrevented) remember();
        });

        return {
            get: key => tables[key],
            remember: remember,
            ready: function (f) {
                if (document.readyState === 'loading') waiting.push(f); else f();
            },
        };
    })();

    // One dialog serves every row: <div class="modal js-row-dialog"> is filled
    // from the button that opened it. data-fill="x" takes the button's data-x
    // (as text, or as the value of an input or select), and a <form data-fill-action>
    // posts to the button's data-url.
    // What this account may not change: the buttons inside an element marked
    // data-needs="<area>" (or "admin") are greyed out, and a click on one says
    // why instead. The server refuses such a change anyway; this only saves
    // the trip.
    window.EasyDC = (function () {
        'use strict';
        let access = null;

        // Shown at the top of the page, or of the dialog the click was in.
        function notice(text, kind, from) {
            const modal = from && from.closest && from.closest('.modal');
            let place = document.getElementById('easydcNotice');
            if (modal) {
                place = modal.querySelector('.js-modal-notice');
                if (!place) {
                    place = document.createElement('div');
                    place.className = 'js-modal-notice px-3 pt-3';
                    const content = modal.querySelector('.modal-header') || modal.querySelector('.modal-content');
                    content.after(place);
                }
            }
            if (!place) return;
            const box = document.createElement('div');
            box.className = 'alert alert-' + (kind || 'warning') + ' alert-dismissible d-flex align-items-start';
            const icon = document.createElement('i');
            icon.className = 'bi bi-shield-lock me-2 mt-1';
            const body = document.createElement('div');
            body.textContent = text;
            const close = document.createElement('button');
            close.type = 'button';
            close.className = 'btn-close';
            close.setAttribute('data-bs-dismiss', 'alert');
            close.setAttribute('aria-label', 'Close');
            box.append(icon, body, close);
            place.replaceChildren(box);
            place.scrollIntoView({ block: 'nearest' });
        }

        // An empty data-needs marks something inside a locked area that anyone
        // may use, such as the dialog that shows a user's details.
        function allowed(need) {
            if (!access || !need) return true;
            if (access.admin) return true;
            return need !== 'admin' && access.edit[need] === true;
        }

        function why(need) {
            return need === 'admin' || !access.labels[need]
                ? 'Only an EasyDC admin can do this.'
                : 'You can view ' + access.labels[need] + ' but not change them. An EasyDC admin can give you Edit on ' +
                  access.labels[need] + ' in Settings.';
        }

        // Checked at the moment of the click, not marked once: a long list
        // keeps the rows of other pages out of the page until they are shown.
        const FREE = '[data-bs-toggle=dropdown], [data-bs-toggle=collapse], [data-bs-dismiss], [data-needs=""], ' +
            'a[href]:not([data-bs-toggle])';
        function blocked(target) {
            const el = target && target.closest && target.closest('[data-needs]');
            return el && !allowed(el.dataset.needs) ? el.dataset.needs : null;
        }

        // Capture, so the click is stopped before Bootstrap opens a dialog.
        document.addEventListener('click', function (e) {
            const need = blocked(e.target);
            // Links that only open a page stay open, as do menus and Close;
            // buttons and the dialogs they open do not.
            if (!need || !e.target.closest('button, [type=submit], .dropdown-item, [data-bs-toggle=modal]')) return;
            if (e.target.closest(FREE)) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            notice(why(need), 'warning', e.target);
        }, true);
        document.addEventListener('submit', function (e) {
            const need = blocked(e.submitter || e.target);
            if (!need) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            notice(why(need), 'warning', e.target);
        }, true);

        document.addEventListener('DOMContentLoaded', function () {
            try { access = JSON.parse(document.body.dataset.access || 'null'); } catch (e) { access = null; }
            if (access && !access.admin) {
                // Grey out what may not be changed, in every row, shown or not yet.
                const off = Object.keys(access.edit).filter(k => !access.edit[k]).concat(['admin']);
                const style = document.createElement('style');
                style.textContent = off.map(k =>
                    '[data-needs="' + k + '"] :is(.btn, .dropdown-item, [type=submit]):not(' + FREE + '),' +
                    ' :is(.btn, .dropdown-item)[data-needs="' + k + '"]').join(',\n') +
                    ' { opacity: .45; cursor: not-allowed; }';
                document.head.appendChild(style);
            }
            // A change the server refused, carried over from the page it was sent from.
            const m = document.cookie.match(/(?:^|; )easydc_flash=([^;]*)/);
            if (m) {
                document.cookie = 'easydc_flash=; Path=/; Max-Age=0; SameSite=Strict';
                try { notice(decodeURIComponent(m[1])); } catch (e) { /* ignore */ }
            }
        });

        return { allowed: allowed, notice: notice };
    })();

    document.addEventListener('show.bs.modal', function (e) {
        const modal = e.target;
        if (!modal.classList.contains('js-row-dialog')) return;
        const from = e.relatedTarget;
        if (!from) return e.preventDefault();
        modal.querySelectorAll('[data-fill]').forEach(function (el) {
            const value = from.dataset[el.dataset.fill] || '';
            if (el.tagName === 'INPUT' || el.tagName === 'SELECT') el.value = value; else el.textContent = value;
        });
        modal.querySelectorAll('form[data-fill-action]').forEach(f => { f.action = from.dataset.url; });
    });
    </script>
</head>
<body{% if access %} data-access="{{ access | json_encode }}"{% endif %}>
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-hdd-network me-1"></i> EasyDC
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="/settings" class="btn btn-outline-light btn-sm" aria-label="Settings" title="Settings">
                    <i class="bi bi-gear"></i><span class="d-none d-sm-inline ms-1">Settings</span>
                </a>
                <a href="/audit" class="btn btn-outline-light btn-sm text-nowrap" aria-label="Audit Log" title="Audit Log">
                    <i class="bi bi-journal-text"></i><span class="d-none d-sm-inline ms-1">Audit Log</span>
                </a>
                <div class="dropdown">
                    <button type="button" class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"
                        aria-expanded="false" aria-label="Your account">
                        <i class="bi bi-person-circle me-1"></i><span class="d-inline-block text-truncate align-bottom" style="max-width: 9rem">{{ access.username | default(value="Account") }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/account"><i class="bi bi-key me-2"></i>Change password</a></li>
                        <li><a class="dropdown-item" href="/account/two-factor"><i class="bi bi-shield-check me-2"></i>Two-factor sign-in</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="/logout">
                                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <div class="{% block container_class %}container{% endblock %} mt-4 pb-5">
        <div id="easydcNotice"></div>
        {% block content %}{% endblock %}
    </div>
    <div style="position:fixed;bottom:0.75rem;right:1rem;font-size:0.75rem;color:#6c757d;pointer-events:none;">
        v{{ app_version() }}
    </div>
    <script src="/static/vendor/bootstrap-5.3.0/bootstrap.bundle.min.js"></script>
    <script>
    // Each server's functional level, loaded after the page so a DC that is down cannot hold it up.
    document.querySelectorAll('.js-server-level').forEach(function (el) {
        fetch(el.dataset.url, { headers: { Accept: 'application/json' } })
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(l => { el.textContent = l.text; el.title = l.title; })
            .catch(() => { el.textContent = 'Functional level unknown'; el.title = 'EasyDC could not read the level from this server.'; });
    });
    </script>
</body>
</html>
