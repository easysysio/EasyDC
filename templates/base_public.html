<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <script>
    (function () {
        let theme = null;
        try { theme = localStorage.getItem('easydc.theme'); } catch (e) { /* storage blocked */ }
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.bsTheme = theme;
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EasyDC{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b5bdb'/><rect x='6' y='8' width='20' height='7' rx='2' fill='%23fff'/><rect x='6' y='17' width='20' height='7' rx='2' fill='%23fff'/><circle cx='10' cy='11.5' r='1.3' fill='%233b5bdb'/><circle cx='10' cy='20.5' r='1.3' fill='%233b5bdb'/></svg>">
    <link rel="stylesheet" href="/static/vendor/bootstrap-5.3.0/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons-1.11.0/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/app/easydc.css">
</head>
<body class="public-page">
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/vendor/bootstrap-5.3.0/bootstrap.bundle.min.js"></script>
</body>
</html>
