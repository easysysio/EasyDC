# Release pipeline: on a v* tag, build .deb + .rpm for x86_64 and arm64, then
# publish a GitHub Release whose body is the matching CHANGELOG section, with
# the packages and a compose.yaml attached, and a container image on Docker Hub.
#
# The binary is linked statically against musl, so it needs no glibc at all and
# the same package runs on any Linux distribution — RHEL 8 included. It is
# built with cargo-zigbuild, whose bundled headers compile the vendored OpenSSL
# and SQLite for musl without a separate cross toolchain.
#
# EasyDC-repo's github2repo.sh pulls those assets down and publishes them,
# signed, at repo.easysys.io/easydc — `--stable` from a release, `--testing`
# from the packages-* artifacts of a run.
name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the job that publishes the release can write.
permissions:
  contents: read

jobs:
  # The same tests CI runs on every push. A tag on a commit that fails them
  # must not produce packages.
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.arch }} packages
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: easydc-linux-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: easydc-linux-arm64
    steps:
      - uses: actions/checkout@v7

      # A v0.2.4 tag on a tree whose Cargo.toml still says 0.2.3 would publish
      # easydc_0.2.3 packages under a v0.2.4 release, and the package repos
      # would index them as the old version. Refuse instead of shipping that.
      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag ${tag}, Cargo.toml ${crate}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${crate} in Cargo.toml"
            exit 1
          fi

      # /bin/sh on the runner is dash, the shell Debian runs package scripts
      # with, so this also proves the migration script has no bashisms.
      - name: Test the legacy-install migration
        run: sh packaging/tests/migrate-legacy.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The same zig release the static build was verified with locally.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install build and packaging tools
        run: cargo install cargo-zigbuild cargo-deb cargo-generate-rpm --locked

      - name: Build static binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/EasyDC

      # The point of the musl build is that nothing is resolved at runtime. A
      # dependency that quietly pulled in dynamic linking would bring the glibc
      # problem straight back, so refuse any binary with a program interpreter
      # or a dynamic section.
      - name: Check the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/EasyDC
          readelf -l "$bin" | sed -n '/Program Headers/,/Section to Segment/p'
          if readelf -l "$bin" | grep -Eq '^\s+(INTERP|DYNAMIC)\b'; then
            echo "::error::${bin} is dynamically linked"
            exit 1
          fi
          echo "fully static: no INTERP, no DYNAMIC"

      # Both tools write straight into dist/: cargo-deb's own output directory
      # differs between versions once --target is given. cargo-generate-rpm
      # will not create the directory itself, so it is made up front rather
      # than relying on the .deb step running first.
      - name: Build .deb
        run: |
          mkdir -p dist
          cargo deb --no-build --target ${{ matrix.target }} --output dist/

      - name: Build .rpm
        run: cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - name: Collect packages
        run: |
          # The bare binary as well, for anyone who wants it without a package
          # manager. github2repo.sh publishes only the .deb and .rpm.
          cp target/${{ matrix.target }}/release/EasyDC "dist/${{ matrix.binary }}"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The same static binaries, as a container image for amd64 and arm64 on
  # Docker Hub: easysysio/easydc:<version>, :<major>.<minor> and :latest.
  # Nothing is compiled here; the Dockerfile's release stage copies each
  # architecture's binary in. It signs in with two repository secrets,
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token that can
  # write to easysysio/easydc).
  docker:
    name: Publish container image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check the Docker Hub secrets are set
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$USERNAME" ] && [ -n "$TOKEN" ] || {
            echo "::error::Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Lay out one binary per architecture
        run: |
          install -D -m 0755 packages/easydc-linux-x86_64 dist/linux-amd64/easydc
          install -D -m 0755 packages/easydc-linux-arm64 dist/linux-arm64/easydc
          ls -lR dist

      # The runtime stage runs apk and adduser for arm64 too.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/easysysio/easydc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The overview on the Docker Hub page, kept in the repository as
      # docker/README.md so it is reviewed and versioned with the rest.
      # Non-fatal: Docker Hub only lets a personal access token with Read,
      # Write, Delete edit it, and an image that was published must not turn
      # into a failed release over its description. Check this step's log
      # after a release.
      - name: Update the Docker Hub overview
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: easysysio/easydc
          readme-filepath: docker/README.md
          short-description: Manage Samba Active Directory from the browser

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md <<EOF

          ### Docker

          \`\`\`bash
          docker pull easysysio/easydc:${version}
          \`\`\`

          Or with Compose: download \`compose.yaml\` below, then \`docker compose up -d\`.
          EOF
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      # The repository's compose.yaml, with the image pinned to this release,
      # so a download keeps running the version it was taken from.
      - name: Pin compose.yaml to this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s|easysysio/easydc:latest|easysysio/easydc:${version}|" compose.yaml > dist/compose.yaml
          grep -q "easysysio/easydc:${version}" dist/compose.yaml
          cat dist/compose.yaml

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: EasyDC ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
