# Release pipeline: on a v* tag, build .deb + .rpm for x86_64 and arm64, then
# publish a GitHub Release whose body is the matching CHANGELOG section, with
# the packages attached.
#
# The binary is linked statically against musl, so it needs no glibc at all and
# the same package runs on any Linux distribution — RHEL 8 included. It is
# built with cargo-zigbuild, whose bundled headers compile the vendored OpenSSL
# and SQLite for musl without a separate cross toolchain.
#
# EasyDC-repo's github2repo.sh pulls those assets down and publishes them,
# signed, at repo.easysys.io/easydc — `--stable` from a release, `--testing`
# from the packages-* artifacts of a run.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: easydc-linux-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: easydc-linux-arm64
    steps:
      - uses: actions/checkout@v4

      # A v0.2.4 tag on a tree whose Cargo.toml still says 0.2.3 would publish
      # easydc_0.2.3 packages under a v0.2.4 release, and the package repos
      # would index them as the old version. Refuse instead of shipping that.
      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag ${tag}, Cargo.toml ${crate}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${crate} in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The same zig release the static build was verified with locally.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install build and packaging tools
        run: cargo install cargo-zigbuild cargo-deb cargo-generate-rpm --locked

      - name: Build static binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/EasyDC

      # The point of the musl build is that nothing is resolved at runtime. A
      # dependency that quietly pulled in dynamic linking would bring the glibc
      # problem straight back, so refuse any binary with a program interpreter
      # or a dynamic section.
      - name: Check the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/EasyDC
          readelf -l "$bin" | sed -n '/Program Headers/,/Section to Segment/p'
          if readelf -l "$bin" | grep -Eq '^\s+(INTERP|DYNAMIC)\b'; then
            echo "::error::${bin} is dynamically linked"
            exit 1
          fi
          echo "fully static: no INTERP, no DYNAMIC"

      # Both tools write straight into dist/: cargo-deb's own output directory
      # differs between versions once --target is given. cargo-generate-rpm
      # will not create the directory itself, so it is made up front rather
      # than relying on the .deb step running first.
      - name: Build .deb
        run: |
          mkdir -p dist
          cargo deb --no-build --target ${{ matrix.target }} --output dist/

      - name: Build .rpm
        run: cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - name: Collect packages
        run: |
          # The bare binary as well, for anyone who wants it without a package
          # manager. github2repo.sh publishes only the .deb and .rpm.
          cp target/${{ matrix.target }}/release/EasyDC "dist/${{ matrix.binary }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: EasyDC ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
