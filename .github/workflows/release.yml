# Release pipeline: on a v* tag, build .deb + .rpm for x86_64 and arm64 on
# native runners, then publish a GitHub Release whose body is the matching
# CHANGELOG section, with the packages attached.
#
# EasyDC-repo's github2repo.sh pulls those assets down and publishes them,
# signed, at repo.easysys.io/easydc — `--stable` from a release, `--testing`
# from the packages-* artifacts of a run.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # The newest glibc the binary may require. Building on the runner itself
  # (ubuntu-24.04, glibc 2.39) produced a binary that would not start on
  # Debian 12, Ubuntu 22.04 or RHEL 9, so the build runs in a Debian 11
  # container instead, and the check below fails the release if anything
  # raises the requirement past this.
  GLIBC_CEILING: "2.31"

jobs:
  build:
    name: Build ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    # Debian 11 (glibc 2.31), with a Rust toolchain, a C compiler, perl for the
    # vendored OpenSSL, and dpkg-dev for cargo-deb's dependency calculation
    # already installed. Covers Debian 11+, Ubuntu 20.04+ and RHEL 9+; RHEL 8
    # (glibc 2.28) is not covered.
    container: rust:1-bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            binary: easydc-linux-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            binary: easydc-linux-arm64
    steps:
      - uses: actions/checkout@v4

      # A v0.2.4 tag on a tree whose Cargo.toml still says 0.2.3 would publish
      # easydc_0.2.3 packages under a v0.2.4 release, and the package repos
      # would index them as the old version. Refuse instead of shipping that.
      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag ${tag}, Cargo.toml ${crate}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${crate} in Cargo.toml"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/EasyDC

      # The compatibility promise is only as good as this check: it reads the
      # versioned glibc symbols the binary actually links against.
      - name: Check the glibc requirement
        run: |
          needed=$(objdump -T target/release/EasyDC | grep -o 'GLIBC_[0-9][0-9.]*' \
                   | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "binary requires glibc ${needed}; ceiling is ${GLIBC_CEILING}"
          highest=$(printf '%s\n%s\n' "$needed" "$GLIBC_CEILING" | sort -V | tail -1)
          if [ "$highest" != "$GLIBC_CEILING" ]; then
            echo "::error::The binary needs glibc ${needed}, newer than the ${GLIBC_CEILING} ceiling"
            exit 1
          fi

      - name: Build .deb
        run: cargo deb --no-build

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Collect packages
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          # The bare binary as well, for hosts outside the Debian and RHEL
          # families and for anyone following the older download instructions.
          # github2repo.sh publishes only the .deb and .rpm.
          cp target/release/EasyDC "dist/${{ matrix.binary }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: EasyDC ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
