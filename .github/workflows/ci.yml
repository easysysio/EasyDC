# Continuous integration: every push to main and every pull request runs the
# tests, clippy, the packaging script's tests, a Docker build, a dependency
# audit and a strict docs build — so a regression is found when it is pushed,
# not when a release is tagged. release.yml stays responsible for building and publishing.
#
# The audit also runs weekly on its own: advisories are published against code
# that has not changed, and 0.3.2's eight were all found that way.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      # Any clippy warning fails the build, so they cannot pile up. A new Rust
      # release can add lints and turn this red on a push that changed nothing
      # related: fix the new warnings, don't silence the check.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # /bin/sh on the runner is dash, the shell Debian runs package scripts with.
      - name: Test the legacy-install migration
        run: sh packaging/tests/migrate-legacy.sh

  # Build the image from source, as `docker build .` does for anyone, start it,
  # and check it answers and keeps its database in the volume.
  docker:
    name: Docker image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: easydc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and check it answers
        run: |
          docker volume create easydc-ci
          docker run -d --name easydc -p 3000:3000 -v easydc-ci:/data easydc:ci
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:3000/login || true)
            [ "$code" = "200" ] || [ "$code" = "303" ] && break
            sleep 1
          done
          echo "GET /login: $code"
          [ "$code" = "200" ] || [ "$code" = "303" ] || { docker logs easydc; exit 1; }
          # A fresh install sends the first visitor to /setup.
          curl -sk -o /dev/null -w 'GET /: %{http_code} -> %{redirect_url}\n' https://127.0.0.1:3000/
          # Plain HTTP on the same port goes to HTTPS.
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://127.0.0.1:3000/login \
            | tee /dev/stderr | grep -q '^307 https://127.0.0.1:3000/login$'
          docker exec easydc sh -c 'id; ls -la /data; test -f /data/easydc.db'
          docker exec easydc sh -c 'test "$(stat -c %a /data)" = 700'
          # The health check passes once the start period is over.
          for i in $(seq 1 20); do
            state=$(docker inspect -f '{{.State.Health.Status}}' easydc)
            [ "$state" = "healthy" ] && break
            sleep 3
          done
          echo "health: $state"
          [ "$state" = "healthy" ] || { docker inspect easydc; exit 1; }

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  docs:
    name: Docs build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      # Every package is pinned with its hash (docs-requirements.txt is a lock
      # file), and wheels only: no package's setup script runs.
      - name: Install MkDocs
        run: |
          pip install --only-binary :all: --require-hashes -r docs-requirements.txt

      # --strict turns a broken link or a missing page into a failure, the same
      # check deploy-docs.sh runs before it replaces the live site.
      - name: Build
        run: mkdocs build --strict
