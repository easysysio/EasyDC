# Continuous integration: every push to main and every pull request runs the
# tests, clippy, the packaging script's tests, a dependency audit and a strict
# docs build — so a regression is found when it is pushed, not when a release
# is tagged. release.yml stays responsible for building and publishing.
#
# Actions are pinned to full commit hashes, with the version in a comment: a
# tag can be moved to other code, a commit cannot.
#
# The audit also runs weekly on its own: advisories are published against code
# that has not changed, and 0.3.2's eight were all found that way.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked

      # Any clippy warning fails the build, so they cannot pile up. A new Rust
      # release can add lints and turn this red on a push that changed nothing
      # related: fix the new warnings, don't silence the check.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # /bin/sh on the runner is dash, the shell Debian runs package scripts with.
      - name: Test the legacy-install migration
        run: sh packaging/tests/migrate-legacy.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  docs:
    name: Docs build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      # Every package is pinned with its hash (docs-requirements.txt is a lock
      # file), and wheels only: no package's setup script runs.
      - name: Install MkDocs
        run: |
          pip install --only-binary :all: --require-hashes -r docs-requirements.txt

      # --strict turns a broken link or a missing page into a failure, the same
      # check deploy-docs.sh runs before it replaces the live site.
      - name: Build
        run: mkdocs build --strict
